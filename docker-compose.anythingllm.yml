version: '3.8'

services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: tiva-anythingllm
    ports:
      - "3001:3001"
    environment:
      # Storage
      - STORAGE_DIR=/app/storage
      - DATABASE_URL=sqlite:///app/storage/anythingllm.db
      
      # LLM Providers (configure at least one)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
      
      # Embedding Providers
      - EMBEDDING_PROVIDER=openai
      - EMBEDDING_MODEL=text-embedding-3-small
      - EMBEDDING_API_KEY=${OPENAI_API_KEY}
      
      # Vector Database (using built-in LanceDB)
      - VECTOR_DB=lancedb
      - LANCEDB_URI=/app/storage/lancedb
      
      # Authentication
      - JWT_SECRET=${JWT_SECRET:-$(openssl rand -base64 32)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tiva.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-TIVA@FounderOS2026!}
      
      # Features
      - ENABLE_MULTI_USER=true
      - ENABLE_API_KEYS=true
      - ENABLE_WEBSOCKET=true
      - MAX_FILE_SIZE=50MB
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      
      # TIVA Specific
      - WORKSPACE_NAME=TIVA Founder OS
      - WORKSPACE_SLUG=tiva-founder-os
      
    volumes:
      - anythingllm_storage:/app/storage
      - anythingllm_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: PostgreSQL for production
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tiva-anythingllm-postgres
    environment:
      - POSTGRES_DB=anythingllm
      - POSTGRES_USER=anythingllm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-$(openssl rand -base64 32)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    profiles:
      - postgres

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: tiva-anythingllm-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles:
      - redis

volumes:
  anythingllm_storage:
  anythingllm_logs:
  postgres_data:
  redis_data:

networks:
  default:
    name: tiva-anythingllm-network